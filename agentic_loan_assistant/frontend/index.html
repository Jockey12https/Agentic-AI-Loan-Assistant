
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agentic Loan Assistant - Demo UI</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      #log { border:1px solid #ddd; padding:10px; height:300px; overflow:auto; }
      button { padding:10px 15px; margin:5px; }
    </style>
  </head>
  <body>
    <h2>Agentic Loan Assistant - Voice Demo</h2>
    <div>
      <label>Customer ID: <input id="customerId" value="cust004"></label>
    </div>
    <div>
      <button id="startRec">🎤 Start Recording</button>
      <button id="stopRec" disabled>Stop</button>
      <button id="sendText">Send Text Message</button>
      <input id="textInput" placeholder="Type message..." style="width:300px">
    </div>
    <div id="log"></div>

    <script src="app.js"></script>
  </body>
</html>
